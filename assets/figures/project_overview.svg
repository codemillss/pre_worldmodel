 <title id="overview-title">Learned dynamics for part-pushing alignment: why, how, and observed meaning</title><desc id="overview-description">Explanatory MuJoCo simulation schematic, not an experimental trajectory. A part must reach its target pose and stop and hold for handoff readiness. Learned dynamics, trained with one-step versus multi-step losses, are used for candidate planning; actual outcomes are checked separately. Some position prediction improved, but an improvement in handoff was not confirmed under the fixed simulated conditions.</desc><metadata>
